name: "PactPay Polyglot CI (Rust + Go + Web)"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: "1.24.0"
  NODE_VERSION: "22.x"
  RUST_BACKTRACE: "1"

jobs:
  # ============================================================================
  # Gate 0: Devpost Stage-1 Disqualifier Guard (R-05)
  # ============================================================================
  license-and-structure-gate:
    name: "Verify MIT License & Blueprint Structure (R-05)"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Root LICENSE and Required Artifacts
        run: |
          if [ ! -s "LICENSE" ]; then
            echo "::error::Missing or empty root LICENSE file (Risk R-05 Stage-1 Disqualifier)!"
            exit 1
          fi
          grep -qi "MIT License" LICENSE || {
            echo "::error::LICENSE must contain valid MIT License header!"
            exit 1
          }
          for path in "README.md" "render.yaml" "postman/PactPay-Sandbox-MCP.postman_collection.json"; do
            if [ ! -f "$path" ]; then
              echo "::warning::Expected artifact $path not yet created in current branch."
            fi
          done
          echo "Root LICENSE verified successfully."

  # ============================================================================
  # Gate 1: Rust 1.85 Zero-Trust KYA & DOM Firewall Kernel (services/firewall-rs)
  # ============================================================================
  rust-firewall-ci:
    name: "Rust 1.85 Firewall & MCP Kernel (F-01, F-02, F-03)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: services/firewall-rs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85 Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Cache Cargo Registry & Target Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/firewall-rs -> target"

      - name: Check Rust Formatting (cargo fmt)
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo fmt --all -- --check
          else
            echo "services/firewall-rs/Cargo.toml not initialized yet; skipping."
          fi

      - name: Run Rust Clippy Linter (Zero Warnings)
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo clippy --all-targets --all-features -- -D warnings
          fi

      - name: Run Rust Unit & Cryptographic Mandate Tests (Ed25519 + lol_html + CRC32)
        env:
          PACTPAY_ENV: "test"
          PACTPAY_ONNX_FAST_FALLBACK: "true"
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test --all-targets -- --nocapture
          fi

  # ============================================================================
  # Gate 2: Golang 1.24 Escrow Orchestrator & APIMatic SDK (services/orchestrator-go)
  # ============================================================================
  go-orchestrator-ci:
    name: "Go 1.24 Orchestrator & APIMatic SDK (F-04, F-05, F-06)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: services/orchestrator-go
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Golang 1.24
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/orchestrator-go/go.sum

      - name: Verify APIMatic Generated Go SDK Integrity
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d "sdk/paypal-go-apimatic" ] && [ -f "sdk/paypal-go-apimatic/go.mod" ]; then
            cd sdk/paypal-go-apimatic && go vet ./...
          fi

      - name: Run golangci-lint
        if: hashFiles('services/orchestrator-go/go.mod') != ''
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: services/orchestrator-go
          args: --timeout=3m

      - name: Run Go Race Detector & 2PC State Machine Unit Tests
        env:
          REDIS_URL: "redis://localhost:6379/0"
          PAYPAL_ENVIRONMENT: "sandbox"
          PAYPAL_SANDBOX_FALLBACK_REPLAY: "true"
        run: |
          if [ -f "go.mod" ]; then
            go test -v -race -coverprofile=coverage.out ./...
            go tool cover -func=coverage.out | tail -n 1
          fi

  # ============================================================================
  # Gate 3: Next.js 15 Command Center UI (AG Grid + Bryntum + PayPal JS SDK v6)
  # ============================================================================
  web-command-center-ci:
    name: "Next.js 15 Command Center UI (F-07, F-08, F-09)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci --prefer-offline --no-audit || npm install
          fi

      - name: Run ESLint
        run: |
          if [ -f "package.json" ]; then
            npm run lint
          fi

      - name: Run Strict TypeScript Compiler Check
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          fi

      - name: Run Frontend Component & State Tests
        run: |
          if [ -f "package.json" ]; then
            npm test -- --run --passWithNoTests
          fi

      - name: Verify Production Next.js Build
        env:
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: "sb-mock-ci-client-id"
          NEXT_PUBLIC_ORCHESTRATOR_URL: "http://localhost:8080"
          NEXT_PUBLIC_FIREWALL_URL: "http://localhost:8081"
        run: |
          if [ -f "package.json" ]; then
            npm run build
          fi
