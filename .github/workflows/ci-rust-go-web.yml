name: "TALOS Polyglot CI — Rust Firewall, Go Orchestrator & Next.js Command Center"

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # Gate 0: Repository Hygiene, MIT License (R-05) & Graphify Integrity
  # ============================================================================
  license-and-structure-gate:
    name: "Gate 0 — MIT License (R-05) & SSoT Integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Root MIT LICENSE File (Devpost Stage-1 Gate R-05)
        run: |
          test -f LICENSE || (echo "::error::Missing root LICENSE file (R-05 disqualification risk)" && exit 1)
          grep -qi "MIT License" LICENSE || (echo "::error::LICENSE must be MIT" && exit 1)

      - name: Verify Core IaC & Specification Artifacts Exist
        run: |
          test -f render.yaml
          test -f api/openapi.yaml
          test -f .planning/graphs/graph.json
          test -f .agent/tasks.json

  # ============================================================================
  # Gate 1: Rust Security Kernel (services/firewall-rs)
  # ============================================================================
  rust-firewall-ci:
    name: "Gate 1 — Rust KYA & DOM Firewall (rmcp + lol_html + ed25519)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/firewall-rs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain (1.85+)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/firewall-rs -> target"

      - name: Check Rust Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (Zero Warnings Policy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Execute Unit & Adversarial Sanitizer Tests
        run: cargo test --all-targets --workspace

  # ============================================================================
  # Gate 2: Go APIMatic SDK & 2PC Escrow Orchestrator (services/orchestrator-go)
  # ============================================================================
  go-orchestrator-ci:
    name: "Gate 2 — Go 1.24 APIMatic PayPal SDK & Escrow State Machine"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify APIMatic PayPal Go SDK Compiles & Passes Tests
        working-directory: sdk/paypal-go-apimatic
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Vet & Test Go Orchestrator (Race Detector Enabled)
        working-directory: services/orchestrator-go
        env:
          PAYPAL_ENVIRONMENT: sandbox
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files: $unformatted"
            exit 1
          fi
          go vet ./...
          go test -v -race ./...

  # ============================================================================
  # Gate 3: Next.js 15 Command Center (AG Grid + AG Studio + Bryntum + PayPal v6)
  # ============================================================================
  web-command-center-ci:
    name: "Gate 3 — Next.js 15 Command Center (TypeScript + Vitest + Build)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm test

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_ORCHESTRATOR_URL: http://localhost:8080
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: sandbox_ci_mock_client_id
        run: npm run build
