name: "TALOS Security, Secret Scanning & Adversarial Prompt-Injection Eval Gate"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Secret Leak & Supply-Chain Audit (Scheduled / Manual Only — Skipped on Push)
  # ============================================================================
  supply-chain-and-secrets:
    name: "Gitleaks, Cargo Audit, Govulncheck & Trivy"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository (Full History for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner (Zero Secret Leak Policy)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust & Run cargo-audit
        uses: actions-rust-lang/audit@v1
        with:
          working-directory: services/firewall-rs

      - name: Set up Go & Run govulncheck
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Execute govulncheck on Go Orchestrator
        working-directory: services/orchestrator-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Trivy Filesystem Vulnerability & Misconfig Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

  # ============================================================================
  # 2. Adversarial DOM Prompt-Injection Benchmark Gate (M-01 & F-02)
  # ============================================================================
  prompt-injection-redteam-eval:
    name: "M-01 & F-02 Adversarial DOM Prompt-Injection Gate (Recall >= 99.0%)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/firewall-rs -> target"

      - name: Verify Red-Team Corpus Exists & Validate Schema
        run: |
          test -f tests/redteam/prompt_injection_suite.json
          python3 -m json.tool tests/redteam/prompt_injection_suite.json > /dev/null

      - name: Execute Adversarial DOM Sanitizer Suite
        working-directory: services/firewall-rs
        run: |
          cargo test -- --nocapture
