# ==============================================================================
# TALOS — RENDER NATIVE POLYGLOT BLUEPRINT (render.yaml)
# Targets: Best Use of Render ($1,000 / $750 / $500 Credits) — Judge Shifra Williams
# Deploys Rust 1.85 + Golang 1.24 + Next.js 15 + PostgreSQL 16 + Valkey in 1 click!
# ==============================================================================
services:
  # 1. Rust Zero-Trust KYA & Prompt-Injection Firewall Kernel (runtime: rust)
  - type: web
    name: talos-firewall-rs
    runtime: rust
    rootDir: services/firewall-rs
    plan: free
    region: oregon
    buildCommand: cargo build --release
    startCommand: ./target/release/talos-firewall-rs
    healthCheckPath: /healthz
    envVars:
      - key: RUST_LOG
        value: info,talos_firewall_rs=debug
      - key: PORT
        value: "8081"
      - key: RUST_FIREWALL_PORT
        value: "8081"
      - key: RUST_ED25519_SEED_HEX
        generateValue: true
      - key: MANDATE_SIGNING_SEED_HEX
        generateValue: true
      - key: ELASTIC_OTLP_ENDPOINT
        sync: false
      - key: ELASTIC_API_KEY
        sync: false

  # 2. Golang 2PC Escrow State Machine & APIMatic PayPal Sandbox Gateway (runtime: go)
  - type: web
    name: talos-orchestrator-go
    runtime: go
    # Built from the repo root (no rootDir): go.mod replaces the APIMatic SDK with
    # ../../sdk/paypal-go-apimatic, and Render hides files outside a service's rootDir.
    plan: free
    region: oregon
    buildFilter:
      paths:
        - services/orchestrator-go/**
        - sdk/paypal-go-apimatic/**
    buildCommand: cd services/orchestrator-go && go build -tags netgo -ldflags '-s -w' -o bin/orchestrator ./cmd/server
    startCommand: ./services/orchestrator-go/bin/orchestrator
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: GO_ORCHESTRATOR_PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: talos-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: talos-valkey
          property: connectionString
      # Free web services cannot receive private-network traffic, so service-to-service calls use public URLs.
      # If Render assigns a suffixed hostname, update RUST_FIREWALL_URL here and in talos-console-web.
      - key: RUST_FIREWALL_URL
        value: https://talos-firewall-rs.onrender.com
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ELASTIC_OTLP_ENDPOINT
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: TALOS_SANDBOX_FALLBACK_ENABLED
        value: "true"

  # 3. Next.js 15 Command Center UI: AG Studio + Bryntum Scheduler Pro + PayPal JS SDK v6 (runtime: node)
  - type: web
    name: talos-console-web
    runtime: node
    rootDir: web
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Public URLs (free web services cannot receive private-network traffic). The proxy rewrites and the
      # NEXT_PUBLIC_* value are baked in at build time: redeploy this service after changing them.
      - key: ORCHESTRATOR_GO_URL
        value: https://talos-orchestrator-go.onrender.com
      - key: RUST_FIREWALL_URL
        value: https://talos-firewall-rs.onrender.com
      - key: NEXT_PUBLIC_ORCHESTRATOR_URL
        value: https://talos-orchestrator-go.onrender.com
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: APIMATIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_TALOS_SANDBOX_FALLBACK_ENABLED
        value: "true"

  # 4. Managed Valkey / Redis for PayPal-Request-Id Idempotency Locks & WebSocket Pub/Sub
  - type: keyvalue
    name: talos-valkey
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # 5. Managed PostgreSQL 16 for Immutable 2PC Escrow & KYA Mandate Ledger
  - name: talos-postgres
    databaseName: talos
    user: talos
    plan: free
    region: oregon
    postgresMajorVersion: "16"
