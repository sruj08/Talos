name: "TALOS Render Blueprint Validation & Live Sandbox Smoke Verification"

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_base_url:
        description: "Live Render Orchestrator Base URL for post-deploy smoke test"
        required: false
        default: "https://talos-orchestrator-go.onrender.com"

jobs:
  validate-render-blueprint:
    name: "Validate render.yaml Blueprint & Postman Collection Schema"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate render.yaml Syntax & Service Definitions
        run: |
          python3 -c '
          import yaml, sys
          with open("render.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          services = [s.get("name") for s in data.get("services", [])]
          required = {"talos-firewall-rs", "talos-orchestrator-go", "talos-console-web"}
          missing = required - set(services)
          if missing:
              print(f"Missing required Render services: {missing}", file=sys.stderr)
              sys.exit(1)
          print("render.yaml verified successfully:", services)
          '

      - name: Validate Postman Collection & Environment JSON Schemas
        run: |
          test -f postman/Talos-Sandbox-MCP.postman_collection.json
          test -f postman/Talos-Sandbox.postman_environment.json
          python3 -m json.tool postman/Talos-Sandbox-MCP.postman_collection.json > /dev/null
          python3 -m json.tool postman/Talos-Sandbox.postman_environment.json > /dev/null

  deploy-and-smoke-test:
    name: "Trigger Render Deploy Hook & Run Postman Newman Smoke Gate"
    needs: validate-render-blueprint
    if: github.event_name == 'workflow_dispatch' || vars.TALOS_LIVE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hooks (If Configured)
        env:
          RENDER_DEPLOY_HOOK_FIREWALL: ${{ secrets.RENDER_DEPLOY_HOOK_FIREWALL }}
          RENDER_DEPLOY_HOOK_ORCHESTRATOR: ${{ secrets.RENDER_DEPLOY_HOOK_ORCHESTRATOR }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_FIREWALL" ]; then curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_FIREWALL"; fi
          if [ -n "$RENDER_DEPLOY_HOOK_ORCHESTRATOR" ]; then curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_ORCHESTRATOR"; fi
          if [ -n "$RENDER_DEPLOY_HOOK_WEB" ]; then curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_WEB"; fi

      - name: Setup Node.js for Postman Newman CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Newman Smoke Test Against Live URL
        env:
          TALOS_LIVE_URL: ${{ github.event.inputs.target_base_url || vars.TALOS_LIVE_URL }}
          TALOS_FIREWALL_URL: ${{ vars.TALOS_FIREWALL_URL }}
        run: |
          npm install -g newman
          if [ -n "$TALOS_LIVE_URL" ] && curl -fsSL --max-time 5 "${TALOS_LIVE_URL}/healthz" > /dev/null 2>&1; then
            FIREWALL_TARGET="${TALOS_FIREWALL_URL:-$TALOS_LIVE_URL}"
            newman run postman/Talos-Sandbox-MCP.postman_collection.json \
              -e postman/Talos-Sandbox.postman_environment.json \
              --env-var "RUST_FIREWALL_URL=${FIREWALL_TARGET}" \
              --env-var "GO_ORCHESTRATOR_URL=${TALOS_LIVE_URL}" \
              --bail
          else
            echo "Live Render URL (${TALOS_LIVE_URL}) not yet reachable; skipping live network Newman run."
          fi

