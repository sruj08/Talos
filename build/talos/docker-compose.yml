services:
  postgres:
    image: postgres:16-alpine
    container_name: talos-postgres
    environment:
      POSTGRES_USER: talos
      POSTGRES_PASSWORD: talos_local_pw
      POSTGRES_DB: talos
    ports:
      - "5432:5432"
    volumes:
      - ./services/orchestrator-go/migrations/0001_init_schema.up.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talos -d talos"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: talos-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
