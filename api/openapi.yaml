openapi: 3.1.0
info:
  title: TALOS — Zero-Trust Agentic Commerce Firewall & Reversible PayPal Escrow API
  version: 1.0.0
  summary: Polyglot Rust (`firewall-rs`), Go (`orchestrator-go`), and Next.js 15 (`web`) API & MCP surface.
  description: |
    Complete OpenAPI 3.1.0 specification for **TALOS** covering `API-01` through `API-16` and entities `E-01` through `E-10`.
    Validated with **APIMatic CLI v3.8** and exported to `postman/Talos-Sandbox-MCP.postman_collection.json`.
  contact:
    name: TALOS Principal Architecture Team
    url: https://github.com/talos/talos
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local Go Escrow Orchestrator (`orchestrator-go`)
  - url: http://localhost:8081
    description: Local Rust Security & MCP Kernel (`firewall-rs`)
  - url: http://localhost:3000
    description: Local Next.js 15 Command Center & MCP Bridge (`web`)
  - url: https://talos-orchestrator-go.onrender.com
    description: Render Cloud Production Blueprint (`F-14`)

tags:
  - name: Rust Firewall & KYA Mandates
    description: "`services/firewall-rs` (`API-01`..`API-04`)"
  - name: Go Escrow Orchestrator
    description: "`services/orchestrator-go` (`API-05`..`API-15`)"
  - name: Next.js Agent & AG Studio Bridge
    description: "`web/` (`API-16`)"

security:
  - BearerAuth: []
  - KyaRFC9421Signature: []

paths:
  /v1/mandates/sign:
    post:
      operationId: signKyaMandate
      summary: "API-01: Sign and register an Ed25519 KYA Spending Mandate (MCP: talos_issue_mandate)"
      tags: [Rust Firewall & KYA Mandates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateSignRequest"
      responses:
        "201":
          description: Cryptographically signed KYA Mandate (`E-03`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KyaMandate"

  /v1/mandates/verify:
    post:
      operationId: verifyKyaMandate
      summary: "API-02: Verify Ed25519 mandate signature, budget cap, and expiry in <1ms (MCP: talos_verify_mandate)"
      tags: [Rust Firewall & KYA Mandates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateVerifyRequest"
      responses:
        "200":
          description: Mandate verification verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateVerifyResponse"

  /v1/firewall/sanitize-dom:
    post:
      operationId: sanitizeMerchantDom
      summary: "API-03: Streaming lol_html + DeBERTa-v3 ONNX prompt-injection sanitizer (MCP: talos_sanitize_dom)"
      tags: [Rust Firewall & KYA Mandates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomSanitizeRequest"
      responses:
        "200":
          description: Forensic DOM scan and stripped injection payload report (`E-04`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallScanLog"

  /v1/firewall/verify-webhook:
    post:
      operationId: verifyPayPalWebhookSignature
      summary: "API-04: Verify PayPal Sandbox PAYPAL-TRANSMISSION-SIG RSA & CRC32 checksum"
      tags: [Rust Firewall & KYA Mandates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookVerifyRequest"
      responses:
        "200":
          description: Cryptographic webhook verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookVerifyResponse"

  /api/v1/checkout/evaluate:
    post:
      operationId: evaluateProtectedCheckout
      summary: "API-05: Full parallel checkout pipeline (KYA + DOM Sanitize + Channel3 + PayPal Orders v2 AUTHORIZE)"
      tags: [Go Escrow Orchestrator]
      parameters:
        - $ref: "#/components/parameters/PayPalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutEvaluateRequest"
      responses:
        "201":
          description: Escrow authorized in PayPal Sandbox and scheduled on Bryntum (`E-06`, `E-07`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowTransaction"
        "202":
          description: Exceeds autonomous cap; step-up co-sign required via PayPal JS SDK v6 (`F-09`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowTransaction"
        "422":
          description: Blocked by Rust DOM Firewall or Channel3 Price-Gouging Oracle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/channel3/benchmark:
    post:
      operationId: benchmarkChannel3Sku
      summary: "API-06: Query Channel3 API across 100M+ SKUs for fair-market median price and spread bps"
      tags: [Go Escrow Orchestrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel3BenchmarkRequest"
      responses:
        "200":
          description: Channel3 price benchmark (`E-05`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel3Benchmark"

  /api/v1/escrow/{id}/authorize:
    post:
      operationId: authorizePayPalEscrow
      summary: "API-07: Place 29-day PayPal Sandbox Orders v2 AUTHORIZE hold via APIMatic Go SDK"
      tags: [Go Escrow Orchestrator]
      parameters:
        - $ref: "#/components/parameters/EscrowId"
        - $ref: "#/components/parameters/PayPalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscrowAuthorizeRequest"
      responses:
        "201":
          description: PayPal Order created and authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowTransaction"

  /api/v1/escrow/{id}/tracking:
    post:
      operationId: attachCarrierTracking
      summary: "API-08: Attach carrier tracking via PayPal Shipment Tracking v1 and update Bryntum SLA bar"
      tags: [Go Escrow Orchestrator]
      parameters:
        - $ref: "#/components/parameters/EscrowId"
        - $ref: "#/components/parameters/PayPalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingAttachRequest"
      responses:
        "200":
          description: Tracking attached and auto-capture evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingAttachResponse"

  /api/v1/escrow/{id}/capture:
    post:
      operationId: capturePayPalAuthorization
      summary: "API-09: Capture authorized PayPal hold upon verified on-time SLA delivery"
      tags: [Go Escrow Orchestrator]
      parameters:
        - $ref: "#/components/parameters/EscrowId"
        - $ref: "#/components/parameters/PayPalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRequest"
      responses:
        "201":
          description: Funds captured in PayPal Sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowTransaction"

  /api/v1/escrow/{id}/void:
    post:
      operationId: voidPayPalAuthorization
      summary: "API-10: Void authorized PayPal hold in 0s upon SLA breach or Bryntum timeline cancellation"
      tags: [Go Escrow Orchestrator]
      parameters:
        - $ref: "#/components/parameters/EscrowId"
        - $ref: "#/components/parameters/PayPalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidRequest"
      responses:
        "200":
          description: Authorization voided and 100% of buyer funds unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowTransaction"

  /api/v1/escrow/{id}/dispute-evidence:
    post:
      operationId: submitDisputeEvidence
      summary: "API-11: Package KYA mandate + Channel3 snapshot + KERNEL screenshot to PayPal Disputes v1"
      tags: [Go Escrow Orchestrator]
      parameters:
        - $ref: "#/components/parameters/EscrowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeEvidenceRequest"
      responses:
        "201":
          description: Dispute evidence bundle submitted (`E-08`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeEvidenceBundle"

  /api/v1/escrow/blotter:
    get:
      operationId: getAgGridBlotter
      summary: "API-12: Return joined EscrowTransaction + FirewallScanLog + Channel3Benchmark rows for AG Grid / AG Studio"
      tags: [Go Escrow Orchestrator]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: state
          in: query
          schema:
            type: string
            default: ALL
      responses:
        "200":
          description: Paginated blotter rows and summary KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlotterResponse"

  /api/v1/sla/timeline:
    get:
      operationId: getBryntumSlaTimeline
      summary: "API-13 (GET): Fetch resources, SLA events, and task dependencies for Bryntum Scheduler Pro"
      tags: [Go Escrow Orchestrator]
      responses:
        "200":
          description: Bryntum Scheduler Pro / Gantt dataset (`E-07`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BryntumTimelineResponse"

  /api/v1/sla/timeline/{task_id}:
    patch:
      operationId: mutateBryntumSlaTask
      summary: "API-13 (PATCH): Mutate SLA deadline or status on Bryntum timeline (triggers PayPal VOID on breach)"
      tags: [Go Escrow Orchestrator]
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlaTimelineTaskPatch"
      responses:
        "200":
          description: Updated SLA timeline task (`E-07`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaTimelineTask"

  /api/v1/webhooks/paypal:
    post:
      operationId: handlePayPalSandboxWebhook
      summary: "API-14: Receive and verify PayPal Sandbox webhooks (Orders, Authorizations, Captures, Disputes)"
      tags: [Go Escrow Orchestrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook verified and recorded in `E-09`

  /ws/events:
    get:
      operationId: subscribeEscrowWebSocket
      summary: "API-15: Real-time WebSocket stream broadcasting state transitions to AG Grid & Bryntum"
      tags: [Go Escrow Orchestrator]
      responses:
        "101":
          description: Switching Protocols to WebSocket stream

  /api/mcp/paypal-bridge:
    post:
      operationId: executeMcpPayPalBridge
      summary: "API-16: TypeScript bridge for @paypal/agent-toolkit, APIMatic Context Plugin, and AG Studio Copilot"
      tags: [Next.js Agent & AG Studio Bridge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpBridgeRequest"
      responses:
        "200":
          description: Agent tool output or AG Studio column/chart reconfiguration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpBridgeResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    KyaRFC9421Signature:
      type: apiKey
      in: header
      name: Signature

  parameters:
    EscrowId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayPalRequestId:
      name: PayPal-Request-Id
      in: header
      required: true
      description: 24-hour Redis Idempotency Lock key (`E-10`) forwarded to PayPal Sandbox
      schema:
        type: string

  schemas:
    PrincipalUser:
      description: "E-01: PrincipalUser"
      type: object
      required: [id, email, organization_name, paypal_sandbox_payer_id, ed25519_pubkey_hex]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        organization_name: { type: string }
        paypal_sandbox_payer_id: { type: string }
        ed25519_pubkey_hex: { type: string, minLength: 64, maxLength: 64 }

    AgentIdentity:
      description: "E-02: AgentIdentity"
      type: object
      required: [id, principal_id, mcp_client_id, ed25519_pubkey_hex, rfc9421_key_id, trust_score, status]
      properties:
        id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        mcp_client_id: { type: string }
        ed25519_pubkey_hex: { type: string }
        rfc9421_key_id: { type: string }
        trust_score: { type: number }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }

    MandateSignRequest:
      type: object
      required: [principal_id, agent_id, max_amount_cents, currency, allowed_categories, max_spread_bps, sla_hours]
      properties:
        principal_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        max_amount_cents: { type: integer, example: 30000 }
        currency: { type: string, default: USD }
        allowed_categories: { type: array, items: { type: string } }
        max_spread_bps: { type: integer, example: 1000 }
        sla_hours: { type: integer, example: 48 }
        ttl_hours: { type: integer, default: 168 }

    KyaMandate:
      description: "E-03: KyaMandate"
      type: object
      required: [mandate_id, principal_id, agent_id, max_amount_cents, currency, ed25519_signature, expires_at]
      properties:
        mandate_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        max_amount_cents: { type: integer }
        currency: { type: string }
        allowed_categories: { type: array, items: { type: string } }
        max_spread_bps: { type: integer }
        sla_hours: { type: integer }
        ed25519_signature: { type: string }
        expires_at: { type: string, format: date-time }

    MandateVerifyRequest:
      type: object
      required: [mandate_id, requested_amount_cents, requested_category, ed25519_signature]
      properties:
        mandate_id: { type: string, format: uuid }
        requested_amount_cents: { type: integer }
        requested_category: { type: string }
        ed25519_signature: { type: string }

    MandateVerifyResponse:
      type: object
      required: [valid, step_up_required, verification_latency_us, reason]
      properties:
        valid: { type: boolean }
        step_up_required: { type: boolean }
        verification_latency_us: { type: integer }
        reason: { type: string }

    DomSanitizeRequest:
      type: object
      required: [merchant_url, raw_html]
      properties:
        mandate_id: { type: string, format: uuid }
        merchant_url: { type: string, format: uri }
        raw_html: { type: string }

    FirewallScanLog:
      description: "E-04: FirewallScanLog"
      type: object
      required: [scan_id, injection_detected, risk_score, raw_dom_hash, sanitized_dom, stripped_payloads, latency_us]
      properties:
        scan_id: { type: string, format: uuid }
        injection_detected: { type: boolean }
        deberta_label: { type: string }
        risk_score: { type: number }
        raw_dom_hash: { type: string }
        sanitized_dom: { type: string }
        stripped_payloads:
          type: array
          items:
            type: object
            properties:
              selector: { type: string }
              rule_id: { type: string }
              excerpt: { type: string }
        latency_us: { type: integer }

    WebhookVerifyRequest:
      type: object
      required: [transmission_id, transmission_time, cert_url, auth_algo, transmission_sig, webhook_id, raw_body]
      properties:
        transmission_id: { type: string }
        transmission_time: { type: string }
        cert_url: { type: string }
        auth_algo: { type: string }
        transmission_sig: { type: string }
        webhook_id: { type: string }
        raw_body: { type: string }

    WebhookVerifyResponse:
      type: object
      required: [verified, crc32_verified, rsa_sig_verified, latency_us]
      properties:
        verified: { type: boolean }
        crc32_decimal: { type: integer }
        crc32_verified: { type: boolean }
        rsa_sig_verified: { type: boolean }
        latency_us: { type: integer }

    Channel3BenchmarkRequest:
      type: object
      required: [sku_query, merchant_ask_cents]
      properties:
        sku_query: { type: string }
        merchant_ask_cents: { type: integer }
        max_allowed_spread_bps: { type: integer, default: 1500 }

    Channel3Benchmark:
      description: "E-05: Channel3Benchmark"
      type: object
      required: [benchmark_id, sku_query, matched_product_id, median_price_cents, lowest_verified_price_cents, spread_bps, gouging_blocked]
      properties:
        benchmark_id: { type: string, format: uuid }
        sku_query: { type: string }
        matched_product_id: { type: string }
        merchant_ask_cents: { type: integer }
        median_price_cents: { type: integer }
        lowest_verified_price_cents: { type: integer }
        lowest_merchant_name: { type: string }
        lowest_merchant_url: { type: string }
        spread_bps: { type: integer }
        gouging_blocked: { type: boolean }

    CheckoutEvaluateRequest:
      type: object
      required: [mandate_id, ed25519_signature, sku_query, category, merchant_name, merchant_url, merchant_paypal_email, amount_cents]
      properties:
        mandate_id: { type: string, format: uuid }
        ed25519_signature: { type: string }
        sku_query: { type: string }
        category: { type: string }
        merchant_name: { type: string }
        merchant_url: { type: string }
        merchant_paypal_email: { type: string, format: email }
        amount_cents: { type: integer }
        currency: { type: string, default: USD }
        raw_html_override: { type: string }

    EscrowAuthorizeRequest:
      type: object
      required: [payer_sandbox_email, payee_sandbox_email, amount_cents]
      properties:
        payer_sandbox_email: { type: string }
        payee_sandbox_email: { type: string }
        amount_cents: { type: integer }
        currency: { type: string, default: USD }
        description: { type: string }

    EscrowTransaction:
      description: "E-06: EscrowTransaction"
      type: object
      required: [escrow_id, state, amount_cents, currency]
      properties:
        escrow_id: { type: string, format: uuid }
        mandate_id: { type: string, format: uuid }
        paypal_order_id: { type: string }
        paypal_auth_id: { type: string }
        paypal_capture_id: { type: string }
        paypal_request_id: { type: string }
        amount_cents: { type: integer }
        currency: { type: string }
        state:
          type: string
          enum: [INITIATED, BLOCKED_FIREWALL, BLOCKED_PRICE_GOUGING, STEP_UP_REQUIRED, PAYPAL_AUTHORIZED, TRACKING_VERIFIED, PAYPAL_CAPTURED, PAYPAL_VOIDED, DISPUTE_EVIDENCE_SUBMITTED]
        step_up_required: { type: boolean }

    TrackingAttachRequest:
      type: object
      required: [carrier, tracking_number, status]
      properties:
        carrier: { type: string, example: FEDEX }
        tracking_number: { type: string }
        status: { type: string, enum: [SHIPPED, IN_TRANSIT, DELIVERED, SLA_BREACHED] }
        auto_capture_on_delivery: { type: boolean, default: true }

    TrackingAttachResponse:
      type: object
      required: [escrow_id, tracking_status, new_escrow_state]
      properties:
        escrow_id: { type: string, format: uuid }
        paypal_tracker_id: { type: string }
        tracking_status: { type: string }
        sla_met: { type: boolean }
        auto_capture_triggered: { type: boolean }
        new_escrow_state: { type: string }
        paypal_capture_id: { type: string }

    CaptureRequest:
      type: object
      properties:
        final_capture: { type: boolean, default: true }
        note_to_payer: { type: string }

    VoidRequest:
      type: object
      required: [void_reason]
      properties:
        void_reason: { type: string }
        triggered_by: { type: string }

    DisputeEvidenceRequest:
      type: object
      required: [paypal_dispute_id, dispute_reason]
      properties:
        paypal_dispute_id: { type: string }
        dispute_reason: { type: string }
        kernel_screenshot_url: { type: string }

    DisputeEvidenceBundle:
      description: "E-08: DisputeEvidenceBundle"
      type: object
      required: [bundle_id, paypal_dispute_id, bundle_sha256, paypal_submission_status, submitted_at]
      properties:
        bundle_id: { type: string, format: uuid }
        paypal_dispute_id: { type: string }
        bundle_sha256: { type: string }
        paypal_submission_status: { type: string }
        submitted_at: { type: string, format: date-time }

    SlaTimelineTask:
      description: "E-07: SlaTimelineTask"
      type: object
      required: [id, escrow_id, name, startDate, endDate, authExpiryDate, escrowState]
      properties:
        id: { type: string, format: uuid }
        escrow_id: { type: string, format: uuid }
        resourceId: { type: string }
        name: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        authExpiryDate: { type: string, format: date-time }
        escrowState: { type: string }
        percentDone: { type: integer }

    SlaTimelineTaskPatch:
      type: object
      properties:
        endDate: { type: string, format: date-time }
        tracking_status: { type: string, enum: [SHIPPED, DELIVERED, SLA_BREACHED, CANCELLED] }
        trigger_void: { type: boolean }

    BlotterResponse:
      type: object
      required: [total_count, rows]
      properties:
        total_count: { type: integer }
        summary_metrics: { type: object }
        rows:
          type: array
          items: { type: object }

    BryntumTimelineResponse:
      type: object
      required: [resources, events, dependencies]
      properties:
        resources: { type: array, items: { type: object } }
        events:
          type: array
          items:
            $ref: "#/components/schemas/SlaTimelineTask"
        dependencies: { type: array, items: { type: object } }

    McpBridgeRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [AG_STUDIO_COPILOT, PAYPAL_AGENT_TOOLKIT] }
        natural_language_query: { type: string }
        tool_name: { type: string }
        tool_args: { type: object }

    McpBridgeResponse:
      type: object
      properties:
        ag_grid_column_state: { type: array, items: { type: object } }
        ag_charts_config: { type: object }
        tool_result: { type: object }
        explanation: { type: string }

    IdempotencyLock:
      description: "E-10: IdempotencyLock (Redis/Valkey)"
      type: object
      required: [request_id, status, ttl_seconds]
      properties:
        request_id: { type: string }
        payload_sha256: { type: string }
        status: { type: string }
        http_status_code: { type: integer }
        ttl_seconds: { type: integer }

    WebhookEventLedger:
      description: "E-09: WebhookEventLedger"
      type: object
      required: [id, transmission_id, event_type, crc32_verified, rsa_sig_verified]
      properties:
        id: { type: string, format: uuid }
        transmission_id: { type: string }
        event_type: { type: string }
        crc32_verified: { type: boolean }
        rsa_sig_verified: { type: boolean }

    ProblemDetails:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, http_status]
          properties:
            code: { type: string }
            message: { type: string }
            http_status: { type: integer }
            trace_id: { type: string }
            details: { type: object }
